# Значення Helm-чарта argo/argo-cd для локального minikube.
#   helm upgrade --install argocd argo/argo-cd -n argocd --create-namespace -f bootstrap/argocd-values.yaml

configs:
  params:
    # UI і API по HTTP: доступ через kubectl port-forward без самопідписаного сертифіката
    server.insecure: true
  cm:
    # як часто Argo CD перечитує Git (за замовчуванням 180s); вебхуків у локального кластера немає
    timeout.reconciliation: 60s

# не потрібні для лабораторної: SSO (Dex) і сповіщення — економимо ресурси minikube
dex:
  enabled: false
notifications:
  enabled: false
