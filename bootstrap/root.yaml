# Кореневий Application (патерн App of Apps) — ЄДИНИЙ об'єкт Argo CD, що застосовується вручну:
#   kubectl apply -f bootstrap/root.yaml
# Він стежить за каталогом argocd-apps/ і створює з нього дочірні Application. Додати новий
# застосунок у кластер = додати його опис у argocd-apps/ і зробити commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/YehorIshchuk/boardgame-shelf-gitops.git
    targetRevision: main
    path: argocd-apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
